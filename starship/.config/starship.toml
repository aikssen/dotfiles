"$schema" = 'https://starship.rs/config-schema.json'

# ============================================================================
# Prompt powerline de 2 líneas — Tokyo Night (tonos oscuros/apagados).
#
# Bloque fijo conectado: OS  user@host  directorio   (siempre presente).
# Tras el directorio, cada contexto (git, lenguaje, paquete, docker, k8s, aws)
# es una PÍLDORA auto-contenida con cápsulas de triángulo. Si no aplica, la
# píldora entera desaparece (sin escaleras de flechas vacías).
#
# Glifos escritos por codepoint -> separadores UNIVERSALES / (U+E0B0/E0B2)
# presentes en toda Nerd Font. Si ves cuadros, es la fuente del terminal.
# ============================================================================

format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_metrics\
$git_state\
$git_status\
$nodejs\
$python\
$golang\
$rust\
$lua\
$ruby\
$package\
$docker_context\
$kubernetes\
$aws\
$fill\
$cmd_duration\
$jobs\
$battery\
$time\
$line_break\
$status\
$character"""

add_newline = true
palette = 'tokyonight'

# --- Bloque fijo: OS -> user@host -> directorio --------------------------------
[os]
disabled = false
style = 'fg:seg_fg bg:os_bg'
format = '[](fg:os_bg)[ $symbol]($style)'

[os.symbols]
Macos = ' '
Ubuntu = ' '
Fedora = ' '
Debian = ' '
Arch = ' '
Alpine = ' '
Linux = ' '
Windows = ' '
Redhat = ' '
RedHatEnterprise = ' '

[username]
show_always = true
style_user = 'fg:seg_fg bg:id_bg'
style_root = 'fg:white bg:red'
format = '[](fg:os_bg bg:id_bg)[ $user]($style)'

[hostname]
ssh_only = false
style = 'fg:seg_fg bg:id_bg'
format = '[@$hostname ]($style)'

[directory]
style = 'fg:seg_fg bg:dir_bg'
format = '[](fg:id_bg bg:dir_bg)[ $path ]($style)[](fg:dir_bg)'
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = false

[directory.substitutions]
'Documents' = '󰈙'
'Downloads' = ' '
'Music' = ' '
'Pictures' = ' '
'Developer' = '󰲋'

# --- Píldora GIT (dark amber): branch, metrics, state, status ------------------
[git_branch]
style = 'fg:seg_fg bg:git_bg'
symbol = ' '
format = ' [](fg:git_bg)[ $symbol$branch]($style)'

[git_metrics]
disabled = false
added_style = 'fg:seg_fg bg:git_bg'
deleted_style = 'fg:seg_fg bg:git_bg'
format = '([ +$added]($added_style))([ -$deleted]($deleted_style))'

[git_state]
style = 'fg:seg_fg bg:git_bg'
format = '[ \($state( $progress_current/$progress_total)\)]($style)'

[git_status]
style = 'fg:seg_fg bg:git_bg'
format = '[( $all_status$ahead_behind) ]($style)[](fg:git_bg)'

# --- Píldoras de LENGUAJE (dark cyan) + PAQUETE (versión del proyecto) ---------
[nodejs]
style = 'fg:seg_fg bg:lang_bg'
symbol = ' '
format = ' [](fg:lang_bg)[ $symbol$version ]($style)[](fg:lang_bg)'

[python]
style = 'fg:seg_fg bg:lang_bg'
symbol = ' '
format = ' [](fg:lang_bg)[ $symbol${pyenv_prefix}$version(\($virtualenv\)) ]($style)[](fg:lang_bg)'
pyenv_version_name = true
pyenv_prefix = ''

[golang]
style = 'fg:seg_fg bg:lang_bg'
symbol = ' '
format = ' [](fg:lang_bg)[ $symbol$version ]($style)[](fg:lang_bg)'

[rust]
style = 'fg:seg_fg bg:lang_bg'
symbol = ' '
format = ' [](fg:lang_bg)[ $symbol$version ]($style)[](fg:lang_bg)'

[lua]
style = 'fg:seg_fg bg:lang_bg'
symbol = ' '
format = ' [](fg:lang_bg)[ $symbol$version ]($style)[](fg:lang_bg)'

[ruby]
style = 'fg:seg_fg bg:lang_bg'
symbol = ' '
format = ' [](fg:lang_bg)[ $symbol$version ]($style)[](fg:lang_bg)'

[package]
style = 'fg:seg_fg bg:pkg_bg'
symbol = '󰏗 '
format = ' [](fg:pkg_bg)[ $symbol$version ]($style)[](fg:pkg_bg)'
display_private = true

# --- Píldora DOCKER (dark teal) -----------------------------------------------
[docker_context]
symbol = ' '
style = 'fg:seg_fg bg:docker_bg'
format = ' [](fg:docker_bg)[ $symbol$context ]($style)[](fg:docker_bg)'
detect_files = ['docker-compose.yml', 'docker-compose.yaml', 'Dockerfile']
detect_extensions = ['Dockerfile']
only_with_files = true

# --- Píldora KUBERNETES (dark green) ------------------------------------------
[kubernetes]
disabled = false
symbol = '󱃾 '
style = 'fg:seg_fg bg:k8s_bg'
format = ' [](fg:k8s_bg)[ $symbol$context( ($namespace)) ]($style)[](fg:k8s_bg)'

# --- Píldora AWS (dark gold) --------------------------------------------------
[aws]
symbol = ' '
style = 'fg:seg_fg bg:aws_bg'
format = ' [](fg:aws_bg)[ $symbol($profile )(\($region\) )(\[$duration\]) ]($style)[](fg:aws_bg)'

# --- Relleno + lado derecho (texto coloreado, sin fondo) ----------------------
[fill]
symbol = ' '

[cmd_duration]
min_time = 500
style = 'fg:gray'
format = '[  $duration ]($style)'

[jobs]
symbol = ' '
style = 'fg:red'
number_threshold = 1
format = '[ $symbol$number]($style)'

[battery]
format = '[ $symbol$percentage ]($style)'
[[battery.display]]
threshold = 20
style = 'fg:red'

[time]
disabled = false
time_format = '%H:%M'
style = 'fg:gray'
format = '[  $time ]($style)'

# --- Línea 2: código de salida en error + character ---------------------------
[status]
disabled = false
style = 'fg:red'
symbol = '✘ '
success_symbol = ''
format = '[$symbol$status ]($style)'
map_symbol = false

[character]
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:purple)'

